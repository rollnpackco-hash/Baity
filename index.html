<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بيتي — لوحة التحكم المالية للأسرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f2f4f3; --card:#ffffff; --ink:#14242b; --muted:#64767d; --line:#e1e7e6;
  --brand:#0b6b5f; --brand-d:color-mix(in srgb,var(--brand) 78%,#000); --brand-l:color-mix(in srgb,var(--brand) 14%,var(--card)); --on-brand:#fff;
  --side:#10222a; --side-t:#b9c9cd; --side-fg:#fff; --side-line:color-mix(in srgb,var(--side-fg) 8%,transparent); --side-hover:color-mix(in srgb,var(--side-fg) 8%,transparent);
  --warn:#c98512; --bad:#c0392b; --ok:#1f8a4c;
  --warn-l:color-mix(in srgb,var(--warn) 14%,var(--card)); --bad-l:color-mix(in srgb,var(--bad) 12%,var(--card)); --ok-l:color-mix(in srgb,var(--ok) 13%,var(--card));
  --shadow:0 1px 2px rgba(16,34,42,.05);
}
[data-theme=dark]{
  --bg:#0c171c; --card:#13242b; --ink:#e7eff1; --muted:#8aa0a7; --line:#223941;
  --brand:#2fb5a3; --side:#0a1317; --side-t:#8ea5ab;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;display:inline-block}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:248px;background:var(--side);color:var(--side-t);position:fixed;inset:0 0 0 auto;display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.brand{padding:22px 20px 18px;display:flex;align-items:center;gap:12px;color:var(--side-fg);border-bottom:1px solid var(--side-line)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--on-brand)}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand small{color:var(--side-t);font-size:11px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;color:var(--side-t);border-radius:8px;text-align:right;width:100%;font-weight:500}
.nav button:hover{background:var(--side-hover);color:var(--side-fg)}
.nav button.on{background:var(--brand);color:var(--on-brand)}
.nav .sep{height:1px;background:var(--side-line);margin:10px 6px}
.me{padding:14px;border-top:1px solid var(--side-line);display:flex;align-items:center;gap:10px;color:var(--side-fg)}
.me .meta{flex:1;min-width:0}
.me .meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .meta small{color:var(--side-t);font-size:11px}
.me button{background:var(--side-hover);border:0;color:var(--side-fg);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.me button:hover{background:color-mix(in srgb,var(--side-fg) 18%,transparent)}
.main{flex:1;margin-right:248px;min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:12px}
.top h1{font-size:19px;font-weight:700;flex:1}
.btn.burger{display:none}
.content{padding:24px 28px 48px;max-width:1400px;margin:0 auto}

/* primitives */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-d);color:var(--on-brand)}
.btn.bad{color:var(--bad)}
.btn.bad:hover{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);margin-right:auto}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--brand-l);color:var(--brand)}
.chip.warn{background:var(--warn-l);color:var(--warn)}
.chip.bad{background:var(--bad-l);color:var(--bad)}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.mute{background:var(--bg);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* forms */
label.f{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.in,select.in,textarea.in{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
.in:focus{border-color:var(--brand);background:var(--card)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.fgrid.c3{grid-template-columns:repeat(3,1fr)}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:14px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:right}
th{font-size:12px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--card));white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--bg) 50%,transparent)}
td.act{white-space:nowrap;text-align:left}

/* hero + kpi */
.hero{padding:24px 26px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.hero .big{font-size:44px;font-weight:700;line-height:1.1;letter-spacing:-1px}
.hero .big small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-right:6px}
.hero p{color:var(--muted);margin-top:6px}
.pace{margin-top:4px}
.pace .track{position:relative;height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
.pace .fill{position:absolute;inset:0 0 0 auto;border-radius:7px}
.pace .today{z-index:1;position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.pace .legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin:4px 0 2px;letter-spacing:-.5px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:4px}
.blist{display:flex;flex-direction:column;gap:14px}
.blist .top2{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.cwrap{position:relative;height:260px}

/* matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:right}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand);cursor:pointer}
input[type=radio]:checked + .dot{outline:3px solid var(--ink);outline-offset:2px}
input[type=checkbox][disabled]{opacity:.5;cursor:not-allowed}

/* modal / toast / login */
.ov{position:fixed;inset:0;background:rgba(8,20,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:60;backdrop-filter:blur(3px)}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;border:1px solid var(--line)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-weight:700;font-size:15px}
.modal header span{flex:1}
.modal .body{padding:20px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
#toasts{position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:13px;animation:tin .2s}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#login{position:fixed;inset:0;z-index:80;background:var(--side);display:none;align-items:center;justify-content:center;padding:16px}
#login.show{display:flex}
.lbox{background:var(--card);border-radius:16px;width:100%;max-width:400px;padding:30px}
.lbox .logo{margin:0 auto 14px;width:52px;height:52px;font-size:24px;border-radius:14px}
.lbox h2{text-align:center;font-size:20px}
.lbox p.sub{text-align:center;color:var(--muted);margin:4px 0 22px;font-size:13px}
.pin{text-align:center;letter-spacing:8px;font-size:20px;font-weight:600}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;background:var(--warn-l);color:var(--warn);font-weight:600;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.scrim{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{transform:translateX(100%)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .main{margin-right:0}
  .btn.burger{display:inline-flex}
  .top{padding:10px 16px}.content{padding:16px 14px 40px}
  .g3,.g2{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}.filters .in:first-child{grid-column:1/-1}
  .fgrid,.fgrid.c3{grid-template-columns:1fr}
  .hero .big{font-size:34px}
}
@media (max-width:520px){.g4{grid-template-columns:1fr}}
@media print{
  .side,.top .btn,.top .burger,.no-print,#toasts,.scrim{display:none!important}
  .main{margin:0}.card,.hero{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="login-form" autocomplete="off">
    <div class="logo">ب</div>
    <h2>بيتي</h2>
    <p class="sub">سجّل دخولك لإدارة مصاريف الأسرة</p>
    <div style="margin-bottom:14px"><label class="f" for="login-user">المستخدم</label><select class="in" id="login-user"></select></div>
    <div style="margin-bottom:18px"><label class="f" for="login-pin">رمز المرور</label><input class="in pin" id="login-pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
    <button class="btn pri" style="width:100%;justify-content:center;padding:11px" type="submit">دخول</button>
    <p class="muted" id="login-note" style="text-align:center;margin-top:14px;font-size:12px"></p>
  </form>
</div>

<div class="app" id="app" style="display:none">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">ب</div><div><b id="brand-name">بيتي</b><small>لوحة التحكم المالية</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <div class="avatar" id="me-av"></div>
      <div class="meta"><b id="me-name"></b><small id="me-role"></small></div>
      <button title="تغيير رمزي" onclick="changeMyPin()" id="b-key"></button>
      <button title="تسجيل الخروج" onclick="logout()" id="b-out"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
  <div class="main">
    <div class="top">
      <button class="btn icon-btn burger" onclick="toggleSide()" id="b-menu" aria-label="القائمة"></button>
      <h1 id="page-title"></h1>
      <button class="btn icon-btn" id="b-theme" onclick="toggleTheme()" title="الوضع الداكن"></button>
      <span id="top-actions" class="row"></span>
    </div>
    <div class="content" id="page"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true"><header><span id="m-title"></span><button class="btn icon-btn sm" onclick="closeModal()" aria-label="إغلاق">✕</button></header><form id="m-form"><div class="body" id="m-body"></div><footer id="m-foot"></footer></form></div></div>
<div id="toasts"></div>

<script>
/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ymd = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const ICONS = {
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M16 7l3 3"/>',
  print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'
};
const ico = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;

/* ============ الحالة ============ */
const KEY = 'bayti_pro_v1', FB_KEY = 'bayti_pro_fb', GH_KEY = 'bayti_pro_gh', THEME_KEY = 'bayti_pro_theme';
const PERMS = [
  ['viewAll','مشاهدة مصروفات كل الأفراد'],['add','إضافة مصروف'],
  ['editOwn','تعديل مصروفاته'],['editAll','تعديل مصروفات الجميع'],
  ['deleteOwn','حذف مصروفاته'],['deleteAll','حذف مصروفات الجميع'],
  ['budgets','تعديل الميزانيات'],['exportData','تصدير البيانات'],
  ['users','إدارة الأفراد والصلاحيات'],['settings','إعدادات النظام'],['viewLog','سجل النشاط']
];
const ALL_ON = Object.fromEntries(PERMS.map(p => [p[0], true]));
const DEFAULT_ROLES = () => ({
  Admin: {label:'مدير', perms:{...ALL_ON}},
  Editor: {label:'محرّر', perms:{viewAll:true,add:true,editOwn:true,deleteOwn:true,exportData:true}},
  Contributor: {label:'مُسجّل', perms:{add:true,editOwn:true}},
  Viewer: {label:'مشاهد', perms:{viewAll:true}}
});
const COLORS = ['#0b6b5f','#0284c7','#4f46e5','#7c3aed','#db2777','#e11d48','#d97706','#059669','#475569'];
const DEFAULT_CATS = () => [
  {id:'c1',name:'السوبر ماركت',icon:'🛒',color:'#0b6b5f',budget:300},
  {id:'c2',name:'فواتير وخدمات',icon:'💡',color:'#0284c7',budget:150},
  {id:'c3',name:'إيجار وأقساط',icon:'🏠',color:'#4f46e5',budget:300},
  {id:'c4',name:'مدارس ودروس',icon:'🏫',color:'#7c3aed',budget:120},
  {id:'c5',name:'صحة وصيدلية',icon:'🏥',color:'#e11d48',budget:60},
  {id:'c6',name:'مطاعم',icon:'🍽️',color:'#ea580c',budget:90},
  {id:'c7',name:'صيانة وأثاث',icon:'🔧',color:'#d97706',budget:60},
  {id:'c8',name:'وقود ومواصلات',icon:'🚗',color:'#475569',budget:70},
  {id:'c9',name:'شخصية وهدايا',icon:'🎁',color:'#db2777',budget:50}
];
const PAYMENTS = ['نقدي','بطاقة / كي نت','تحويل بنكي','أخرى'];
let S = null;                       // البيانات
let session = {uid: sessionStorage.getItem('bayti_uid') || null};
let page = 'dashboard', dashMonth = ymd().slice(0, 7), charts = [];
let F = {q:'', cat:'', user:'', from:'', to:''};
let fails = 0, lockUntil = 0;

function seed() {
  return {
    v: 1, updatedAt: 0,
    users: [{id:'u_admin', name:'المدير', relation:'رب الأسرة', role:'Admin', color:COLORS[0], active:true, defaultPin:true, salt:'s0', pinHash:null}],
    expenses: [], recurring: [], categories: DEFAULT_CATS(), roles: DEFAULT_ROLES(), log: [],
    settings: {familyName:'بيتي', currency:'د.ك', decimals:3, monthlyBudget:1200, colors:{}}
  };
}
function normalize(d) {
  const b = seed(); d = d || {};
  const out = {...b, ...d, settings:{...b.settings, ...(d.settings || {})}};
  out.roles = {...DEFAULT_ROLES(), ...(d.roles || {})};
  out.roles.Admin.perms = {...ALL_ON};
  ['users','expenses','recurring','categories','log'].forEach(k => { if (!Array.isArray(out[k])) out[k] = b[k]; });
  return out;
}
async function hashPin(pin, salt) {
  const data = salt + ':' + pin;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  }

function nextDue(r) { let m = r.lastGen ? addMonths(r.lastGen, 1) : r.startMonth; return m < r.startMonth ? r.startMonth : m; }
/* ينزّل مصروفات كل شهر مستحق (يوم 1). المعرّف ثابت (er_<دورية>_<شهر>) فلا يتكرر حتى لو فتحت الصفحة من عدة أجهزة. */
function runRecurring() {
  if (!me() || (sync.on && !sync.first)) return 0;
  const nowM = ymd().slice(0, 7); let n = 0, touched = false;
  (S.recurring || []).forEach(r => {

    let m = nextDue(r);
    while (m <= nowM) {
      const id = 'er_' + r.id + '_' + m;
      if (!S.expenses.some(e => e.id === id)) { S.expenses.push({id, title:r.title, amount:r.amount, date:m + '-01', category:r.category, payment:r.payment, notes:r.notes || '', userId:r.userId, createdAt:new Date().toISOString(), recurId:r.id}); n++; }
      r.lastGen = m; touched = true; m = addMonths(m, 1);

/* ============ المزامنة (Firebase اختياري) ============ */
let sync = {on:false, kind:null, first:true, status:'غير مفعّلة', push:null};
function syncChip(kind) {
  const on = sync.on && sync.kind === kind;
  return `<span class="chip sync-chip ${on ? (sync.first ? 'ok' : 'warn') : 'mute'}" data-kind="${kind}" style="margin-right:auto">${esc(on ? sync.status : 'غير مفعّلة')}</span>`;
}
function paintSync() {
  document.querySelectorAll('.sync-chip').forEach(c => {
    const on = sync.on && sync.kind === c.dataset.kind;
    c.textContent = on ? sync.status : 'غير مفعّلة';
    c.className = 'chip sync-chip ' + (on ? (/✓/.test(sync.status) ? 'ok' : (!sync.first || /جارٍ/.test(sync.status)) ? 'warn' : 'bad') : 'mute');
  });
}
function pushRemote() { if (sync.push) sync.push(); }
const modalOpen = () => $('#ov').classList.contains('show');
function applyRemote(d) {
  S = normalize(d); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (session.uid && !me()) session.uid = null;
  render();
}
async function startSync() {
  if (localStorage.getItem(GH_KEY)) return startGitHub();
  const raw = localStorage.getItem(FB_KEY); if (!raw) return;
  sync.on = true; sync.kind = 'fb'; sync.first = false; sync.status = 'جارٍ الاتصال...';
  setTimeout(() => { if (!sync.first) { sync.first = true; sync.status = 'تعذّر الاتصال — وضع محلي'; paintSync(); } }, 7000);
  try {
    const cfg = JSON.parse(raw), base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [A, Au, Fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = A.initializeApp(cfg); await Au.signInAnonymously(Au.getAuth(app));
    const ref = Fs.doc(Fs.getFirestore(app), 'households', cfg.projectId || 'main');
    sync.push = () => Fs.setDoc(ref, {json:JSON.stringify(S), updatedAt:S.updatedAt}).catch(e => { sync.status = 'خطأ في الحفظ: ' + (e.code || ''); paintSync(); });
    Fs.onSnapshot(ref, snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists()) { sync.push(); }
      else {
        const d = snap.data();
        if (d.updatedAt > S.updatedAt) applyRemote(JSON.parse(d.json));
        else if (d.updatedAt < S.updatedAt) sync.push();
      }
      sync.first = true; sync.status = 'متصلة ✓'; paintSync(); if (runRecurring()) render();
    }, err => { sync.first = true; sync.status = 'خطأ: ' + (err.code || 'اتصال'); paintSync(); });
  } catch (e) { sync.first = true; sync.status = 'إعدادات غير صالحة'; paintSync(); }
}
function saveSync() {
  try { const c = JSON.parse($('#s-fb').value); if (!c.apiKey || !c.projectId) throw 0; localStorage.setItem(FB_KEY, JSON.stringify(c)); localStorage.removeItem(GH_KEY); toast('تم الحفظ، سيُعاد تحميل الصفحة'); setTimeout(() => location.reload(), 900); }
  catch (e) { toast('الصيغة غير صحيحة. الصق كائن firebaseConfig كاملاً بصيغة JSON', 'err'); }
}
function stopSync() { localStorage.removeItem(FB_KEY); localStorage.removeItem(GH_KEY); toast('تم إيقاف المزامنة'); setTimeout(() => location.reload(), 700); }

function saveGitHub() {
  const c = {owner:$('#gh-owner').value.trim(), repo:$('#gh-repo').value.trim(), branch:$('#gh-branch').value.trim() || 'main', path:$('#gh-path').value.trim().replace(/^\/+/, '') || 'data.json', token:$('#gh-token').value.trim()};

  localStorage.setItem(GH_KEY, JSON.stringify(c)); localStorage.removeItem(FB_KEY);
  toast('تم الحفظ، سيُعاد تحميل الصفحة'); setTimeout(() => location.reload(), 900);
}
async function startGitHub() {
  const cfg = JSON.parse(localStorage.getItem(GH_KEY));
  sync.on = true; sync.kind = 'gh'; sync.first = false; sync.status = 'جارٍ الاتصال بـ GitHub...';
  const api = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
  const H = {Authorization:'Bearer ' + cfg.token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  const enc = t => btoa(unescape(encodeURIComponent(t))), dec = b => decodeURIComponent(escape(atob(b.replace(/\s/g, ''))));
  let sha = null, pushing = false, again = false, timer = null;
  const explain = e => e.message === '401' ? 'الـ Token غير صحيح أو منتهٍ' : (e.message === '403' || e.message === '404') ? 'تحقق من اسم المستودع وصلاحية Contents للـ Token' : e.message === 'Failed to fetch' ? 'لا يوجد اتصال' : 'خطأ ' + e.message;
  setTimeout(() => { if (!sync.first) { sync.first = true; sync.status = 'تعذّر الاتصال — وضع محلي'; paintSync(); } }, 10000);

  async function pull() {
    const r = await fetch(api + '?ref=' + encodeURIComponent(cfg.branch) + '&_=' + Date.now(), {headers:H, cache:'no-store'});
    if (r.status === 404) { sha = null; return null; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); sha = j.sha;
    return JSON.parse(dec(j.content));
  }
  async function put() {
    const body = {message:'bayti sync ' + new Date().toISOString(), content:enc(JSON.stringify(S)), branch:cfg.branch};
    if (sha) body.sha = sha;
    const r = await fetch(api, {method:'PUT', headers:{...H, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (r.status === 409 || r.status === 422) return false;
    if (!r.ok) throw new Error(r.status);
    sha = (await r.json()).content.sha; return true;
  }
  async function reconcile(tries = 0) {
    const d = await pull();
    if (!d) { if (!(await put()) && tries < 3) await reconcile(tries + 1); return; }
    if (d.updatedAt > S.updatedAt) applyRemote(d);
    else if (d.updatedAt < S.updatedAt && !(await put()) && tries < 3) await reconcile(tries + 1);
  }
  async function flush() {
    if (pushing) { again = true; return; }
    pushing = true; sync.status = 'جارٍ الحفظ...'; paintSync();
    try { if (!(await put())) await reconcile(); sync.status = 'متصلة ✓ (GitHub)'; } catch (e) { sync.status = explain(e); }
    pushing = false; paintSync(); if (again) { again = false; flush(); }
  }
  sync.push = () => { clearTimeout(timer); timer = setTimeout(flush, 1200); };
  try { await reconcile(); sync.status = 'متصلة ✓ (GitHub)'; } catch (e) { sync.status = explain(e); }
  sync.first = true; paintSync(); if (runRecurring()) render();
  setInterval(async () => {
    if (pushing || modalOpen() || document.hidden) return;
    try { await reconcile(); sync.status = 'متصلة ✓ (GitHub)'; } catch (e) { sync.status = explain(e); } paintSync();
  }, 30000);
}

/* ============ الألوان والمظهر ============ */
const DEF_COLORS = {brand:'#0b6b5f', side:'#10222a', budget:'#c98512', ok:'#1f8a4c', warn:'#c98512', bad:'#c0392b'};
const PRESETS = [
  {n:'أخضر زمردي', c:{}},
  {n:'أزرق', c:{brand:'#1d5fd1', side:'#0f1d3a', budget:'#e0a030'}},
  {n:'بنفسجي', c:{brand:'#6d3fc7', side:'#1d1535', budget:'#e0a030'}},
  {n:'برتقالي', c:{brand:'#c2540a', side:'#2a1a10', budget:'#0b6b5f'}},
  {n:'وردي', c:{brand:'#be1f5e', side:'#2b1220', budget:'#0f766e'}},
  {n:'رمادي', c:{brand:'#334155', side:'#0f172a', budget:'#d97706'}}
];
let draft = null;
const colorsNow = () => draft || S.settings.colors || {};
const cssVar = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function effColor(k) {
  const c = colorsNow(); if (c[k]) return c[k];
  if (k === 'chart') return effColor('brand');
  if (k === 'budget') return DEF_COLORS.budget;
  return cssVar('--' + k) || DEF_COLORS[k];
}
const rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) || 0); };
const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const hexA = (h, a) => 'rgba(' + rgb(h).join(',') + ',' + a + ')';
function applyTheme() {
  const r = document.documentElement.style, c = colorsNow();
  ['brand', 'side', 'ok', 'warn', 'bad'].forEach(k => c[k] ? r.setProperty('--' + k, c[k]) : r.removeProperty('--' + k));
  const brand = cssVar('--brand'), side = cssVar('--side');
  r.setProperty('--on-brand', lum(brand) > .5 ? '#10222a' : '#fff');
  if (c.side && lum(side) > .45) { r.setProperty('--side-fg', '#10222a'); r.setProperty('--side-t', '#4a5f66'); }
  else { r.removeProperty('--side-fg'); r.removeProperty('--side-t'); }
}
function tc() { const main = colorsNow().chart || effColor('brand'); return {main, budget:effColor('budget'), fill:hexA(main, .12), soft:hexA(main, .3)}; }
function themeCard() {
  const field = (k, l) => `<div><label class="f">${l}</label><div class="row"><input type="color" value="${effColor(k)}" oninput="previewColor('${k}',this.value)" style="width:48px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer"><span class="num muted" id="hex-${k}">${effColor(k)}</span></div></div>`;
  return `<div class="card pad" style="margin-bottom:16px"><h3>المظهر والألوان ${draft ? '<span class="chip warn" style="margin-right:auto">معاينة غير محفوظة</span>' : ''}</h3>
    <label class="f">ألوان جاهزة</label>
    <div class="row" style="margin-bottom:18px">${PRESETS.map((p, i) => `<button class="btn" onclick="applyPreset(${i})"><span class="dot" style="background:${p.c.brand || DEF_COLORS.brand}"></span><span class="dot" style="background:${p.c.side || DEF_COLORS.side}"></span> ${p.n}</button>`).join('')}</div>
    <div class="fgrid c3">${field('brand', 'اللون الأساسي (الأزرار والقائمة)')}${field('side', 'لون الشريط الجانبي')}${field('chart', 'لون الرسوم البيانية')}${field('budget', 'لون خط الميزانية')}${field('ok', 'حالة: ضمن الميزانية')}${field('warn', 'حالة: تنبيه')}${field('bad', 'حالة: تجاوز الميزانية')}</div>
    <p class="muted" style="margin:14px 0">التغيير يظهر فوراً للمعاينة ولا يُحفظ إلا بزر «حفظ الألوان». ألوان التصنيفات تُعدَّل من جدول التصنيفات أدناه، ولون كل فرد من صفحة الأفراد.</p>
    <div class="row"><button class="btn pri" onclick="saveColors()">حفظ الألوان</button><button class="btn" onclick="resetColors()">استعادة الافتراضي</button><button class="btn" onclick="toggleTheme()">تبديل الوضع الفاتح / الداكن</button></div></div>`;
}
function previewColor(k, v) { draft = {...colorsNow(), [k]: v}; applyTheme(); const h = $('#hex-' + k); if (h) h.textContent = v; }
function applyPreset(i) { draft = {...PRESETS[i].c}; applyTheme(); paintPage(); }
function saveColors() {
  if (!can('settings')) return;
  if (!draft) return toast('لا توجد تغييرات للحفظ', 'err');
  S.settings.colors = {...draft}; draft = null; save('غيّر ألوان النظام'); toast('تم حفظ الألوان'); render();
}
function resetColors() { if (!can('settings')) return; draft = {}; saveColors(); }

/* ============ البدء ============ */
(async function init() {
  const t = localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  load();
  for (const u of S.users) if (u.pinHash === null) u.pinHash = await hashPin('1234', u.salt);
  render();
  startSync();
  setInterval(() => { if (me() && !modalOpen() && runRecurring()) render(); }, 3600000);
})();
</script>
</body>
</html>
